<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="WYVgAFbhD_nKs5PT-tZCQ07SoEefCBqN049VzFy6dQw" />
<title>レベル制算数ドリル</title>
<style>
body{font-family:sans-serif}
.section{border:1px solid #ccc;margin:6px 0;padding:4px;background:#fff7e6}
.header{display:flex;justify-content:space-between;align-items:center;background:#f6a04d;padding:4px}
.title{font-weight:bold}
.status{font-weight:bold;color:green;margin-left:8px}
.problemBox{margin:6px 0;padding:6px;border:1px solid #ccc}
.score{margin-top:4px;font-weight:bold}
.saveLoad{margin:10px 0;padding:6px;border:1px solid #ccc;background:#eef}
#clearList{border:1px solid #ccc;padding:6px;background:#e0ffe0;margin:10px 0}
#dialogBg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center}
#dialogBox{background:#fff;padding:20px;border-radius:6px;width:300px}
#dialogTitle{font-weight:bold;margin-bottom:10px}
#dialogMsg{margin-bottom:20px}
#dialogBtns{display:flex;justify-content:flex-end;gap:10px}
</style>
</head>
<body>
<h2>レベル制算数ドリル</h2>
<p>レベル:<span id="level">1</span>　ポイント:<span id="point">0</span></p>

<div class="saveLoad">
<div>セーブコード: <span id="saveCode">未セーブ</span></div>
<button id="saveBtn">セーブ</button>
<br>
<input id="loadInput" placeholder="セーブコードを入力">
<button id="loadBtn">ロード</button>
</div>

<div id="clearList"><b>合格一覧:</b><div id="clearItems"></div></div>

<div id="drillContainer"></div>
<div id="testContainer"></div>

<div id="dialogBg">
<div id="dialogBox">
<div id="dialogTitle">結果</div>
<div id="dialogMsg"></div>
<div id="dialogBtns">
<button id="dialogOk">OK</button>
<button id="dialogCancel">キャンセル</button>
</div>
</div>
</div>

<script>
let level=1,point=0;
let clearList=[];
let drills=[];

function r(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function genProblem(lv){
let t;
if(lv<=5)t=r(0,4);
else if(lv<=10)t=r(0,6);
else if(lv<=20)t=r(0,7);
else t=r(0,9);
let q,a,name;
if(t===0){let x=r(1,50),y=r(1,50);q=x+"+"+y+"=?";a=x+y;name="足し算";}
else if(t===1){let x=r(1,50),y=r(1,50);if(x<y){let tmp=x;x=y;y=tmp}q=x+"-"+y+"=?";a=x-y;name="引き算";}
else if(t===2){let x=r(2,12),y=r(2,12);q=x+"×"+y+"=?";a=x*y;name="かけ算";}
else if(t===3){let y=r(2,12),x=y*r(2,12);q=x+"÷"+y+"=?";a=x/y;name="わり算";}
else if(t===4){let x=r(10,99),y=r(10,99);q=x+"+"+y+"=?";a=x+y;name="大きな足し算";}
else if(t===5){let n1=r(1,9),d1=r(2,9),n2=r(1,9),d2=r(2,9);q=n1+"/"+d1+"+"+n2+"/"+d2+"=?(小数)";a=Number((n1/d1+n2/d2).toFixed(3));name="分数計算";}
else if(t===6){let base=r(100,500),per=r(10,80);q=base+"の"+per+"%は？";a=Number((base*per/100).toFixed(2));name="割合";}
else if(t===7){let a1=r(2,20),b1=r(2,20);let g=function(x,y){return y?g(y,x%y):x}(a1,b1);q=a1+":"+b1+"を簡単にすると？";a=(a1/g)+":"+(b1/g);name="比";}
else{let v=r(2,20),t1=r(1,5),t2=r(1,5);q="時速"+v+"kmで"+t1+"時間→さらに"+t2+"時間で何km？";a=v*(t1+t2);name="速さ";}
return {name,q,a};
}

function problemCount(lv){
if(lv<=5)return 20;
if(lv<=10)return 25;
if(lv<=15)return 30;
if(lv<=20)return 35;
if(lv<=25)return 40;
return 50;
}

function generateDrills(){
drills=[];
for(let i=0;i<20;i++){
let ps=[];
let cnt=problemCount(level);
let kinds=new Set();
for(let j=0;j<cnt;j++){
let p=genProblem(level);
ps.push(p);
kinds.add(p.name);
}
let kindText=Array.from(kinds).join(" / ");
drills.push({title:"ドリル"+(i+1),kinds:kindText,problems:ps,status:"未合格"});
}
applyClearStatus();
renderDrills();
}

function applyClearStatus(){
clearList.forEach(n=>{
let idx=parseInt(n.replace("ドリル",""))-1;
if(drills[idx])drills[idx].status="合格";
});
}

function renderClearList(){
document.getElementById("clearItems").innerHTML=clearList.join("<br>");
}

function renderDrills(){
const c=document.getElementById("drillContainer");
c.innerHTML="";
document.getElementById("testContainer").innerHTML="";
drills.forEach((d,i)=>{
const s=document.createElement("div");
s.className="section";
const h=document.createElement("div");
h.className="header";
const t=document.createElement("span");
t.className="title";
t.textContent=d.title+" (Lv"+level+") – "+d.kinds;
const btn=document.createElement("button");
btn.textContent="スタート";
btn.onclick=()=>startDrill(i);
const st=document.createElement("span");
st.className="status";
st.textContent=d.status;
h.appendChild(t);
h.appendChild(btn);
h.appendChild(st);
s.appendChild(h);
c.appendChild(s);
});
}

function showDialog(msg,ok){
document.getElementById("dialogMsg").textContent=msg;
document.getElementById("dialogBg").style.display="flex";
document.getElementById("dialogOk").onclick=function(){
document.getElementById("dialogBg").style.display="none";
if(ok)ok();
};
document.getElementById("dialogCancel").onclick=function(){
document.getElementById("dialogBg").style.display="none";
};
}

function startDrill(i){
const d=drills[i];
const c=document.getElementById("drillContainer");
c.innerHTML="";
d.problems.forEach((p,j)=>{
const b=document.createElement("div");
b.className="problemBox";
b.innerHTML="<b>"+p.name+" "+(j+1)+"</b><br>"+p.q+"<br><input id='ans"+j+"'>";
c.appendChild(b);
});
const f=document.createElement("button");
f.textContent="採点";
f.onclick=()=>{
let score=0;
d.problems.forEach((p,j)=>{
let u=document.getElementById("ans"+j).value;
if(typeof p.a==="number"){
if(Number(u)===p.a)score+=100/d.problems.length;
}else{
if(String(u)===String(p.a))score+=100/d.problems.length;
}
});
score=Math.round(score);
let result=score===100?"合格":"未合格";
if(score===100){
d.status="合格";
point+=10;
document.getElementById("point").textContent=point;
clearList.push(d.title);
renderClearList();
checkComplete();
}else d.status="未合格";
showDialog(d.title+" / "+result+" / "+score+"点",()=>renderDrills());
};
c.appendChild(f);
}

function checkComplete(){
let ok=drills.every(d=>d.status==="合格");
if(ok)showTest();
}

function showTest(){
const c=document.getElementById("testContainer");
c.innerHTML="";
const s=document.createElement("div");
s.className="section";
const h=document.createElement("div");
h.className="header";
const tl=document.createElement("span");
tl.className="title";
tl.textContent="レベル"+level+" テスト(100問)";
const btn=document.createElement("button");
btn.textContent="スタート";
btn.onclick=startTest;
h.appendChild(tl);
h.appendChild(btn);
s.appendChild(h);
c.appendChild(s);
}

function startTest(){
let test=[];
for(let i=0;i<100;i++)test.push(genProblem(level));
const c=document.getElementById("testContainer");
c.innerHTML="";
test.forEach((p,j)=>{
const b=document.createElement("div");
b.className="problemBox";
b.innerHTML="<b>"+p.name+" "+(j+1)+"</b><br>"+p.q+"<br><input id='tans"+j+"'>";
c.appendChild(b);
});
const f=document.createElement("button");
f.textContent="採点";
f.onclick=()=>{
let score=0;
test.forEach((p,j)=>{
let u=document.getElementById("tans"+j).value;
if(typeof p.a==="number"){
if(Number(u)===p.a)score+=100/test.length;
}else{
if(String(u)===String(p.a))score+=100/test.length;
}
});
score=Math.round(score);
let result=score===100?"合格":"未合格";
showDialog("テスト結果 / "+result+" / "+score+"点",()=>{
if(score===100){
level++;
if(level>30)level=30;
document.getElementById("level").textContent=level;
generateDrills();
}
});
};
c.appendChild(f);
}

function makeSaveCode(){
let clears=clearList.map(n=>n.replace("ドリル",""));
return level+"|"+point+"|"+clears.join(",");
}

function applySaveCode(code){
if(code.indexOf("|")===-1){
let lv=Math.floor(code/100000);
let pt=code%100000;
level=lv;
point=pt;
clearList=[];
document.getElementById("level").textContent=level;
document.getElementById("point").textContent=point;
generateDrills();
renderClearList();
return true;
}
let parts=code.split("|");
if(parts.length<3)return false;
let lv=parseInt(parts[0]);
let pt=parseInt(parts[1]);
let cls=parts[2].split(",").filter(x=>x);
if(isNaN(lv)||isNaN(pt))return false;
level=lv;
point=pt;
clearList=cls.map(n=>"ドリル"+n);
document.getElementById("level").textContent=level;
document.getElementById("point").textContent=point;
generateDrills();
renderClearList();
return true;
}

document.getElementById("saveBtn").onclick=function(){
let code=makeSaveCode();
document.getElementById("saveCode").textContent=code;
};

document.getElementById("loadBtn").onclick=function(){
let code=document.getElementById("loadInput").value.trim();
if(code==="")return;
let ok=applySaveCode(code);
if(!ok)alert("コードが正しくありません");
};

generateDrills();
renderClearList();
</script>
</body>
</html>
